<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exp15 – Real-time Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
    header { background: #16213e; padding: 16px 24px; font-size: 20px; font-weight: bold; color: #0f3460; color: #e94560; }
    .container { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: 200px; background: #16213e; padding: 16px; border-right: 1px solid #0f3460; }
    #sidebar h3 { color: #e94560; margin-bottom: 10px; font-size: 14px; }
    #userList { list-style: none; }
    #userList li { padding: 4px 0; font-size: 13px; color: #aaa; }
    #userList li::before { content: '● '; color: #2ecc71; }
    #chat { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #16213e; border-radius: 8px; padding: 10px 14px; max-width: 70%; }
    .msg .meta { font-size: 11px; color: #888; margin-bottom: 4px; }
    .msg .meta .name { color: #e94560; font-weight: bold; }
    .msg .text { font-size: 15px; }
    .msg.mine { background: #0f3460; align-self: flex-end; }
    .system-msg { text-align: center; font-size: 12px; color: #666; padding: 4px; }
    #inputArea { display: flex; gap: 8px; padding: 12px; background: #16213e; border-top: 1px solid #0f3460; }
    #msgInput { flex: 1; padding: 10px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 14px; }
    button { padding: 10px 20px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    button:hover { background: #c0392b; }
    #joinScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .joinBox { background: #16213e; padding: 32px; border-radius: 12px; text-align: center; display: flex; flex-direction: column; gap: 16px; min-width: 300px; }
    .joinBox h2 { color: #e94560; }
    .joinBox input { padding: 10px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 15px; text-align: center; }
  </style>
</head>
<body>

<div id="joinScreen">
  <div class="joinBox">
    <h2>💬 Real-time Chat</h2>
    <p>Exp 15 – Socket.IO Demo</p>
    <input type="text" id="usernameInput" placeholder="Enter your name..." maxlength="20">
    <button onclick="joinChat()">Join Chat</button>
  </div>
</div>

<header>💬 Exp15 – Real-time Chat (Socket.IO)</header>
<div class="container">
  <div id="sidebar">
    <h3>Online Users</h3>
    <ul id="userList"></ul>
  </div>
  <div id="chat">
    <div id="messages"></div>
    <div id="inputArea">
      <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myUsername = '';

  function joinChat() {
    const name = document.getElementById('usernameInput').value.trim();
    if (!name) return alert('Please enter a name');
    myUsername = name;
    socket.emit('join', myUsername);
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('msgInput').focus();
  }

  function sendMsg() {
    const input = document.getElementById('msgInput');
    const msg = input.value.trim();
    if (!msg) return;
    socket.emit('message', msg);
    input.value = '';
  }

  socket.on('message', ({ username, message, time }) => {
    const div = document.createElement('div');
    div.className = 'msg' + (username === myUsername ? ' mine' : '');
    div.innerHTML = `<div class="meta"><span class="name">${username}</span> · ${time}</div><div class="text">${message}</div>`;
    document.getElementById('messages').appendChild(div);
    div.scrollIntoView();
  });

  socket.on('system', (msg) => {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = msg;
    document.getElementById('messages').appendChild(div);
    div.scrollIntoView();
  });

  socket.on('userList', (users) => {
    document.getElementById('userList').innerHTML = users.map(u => `<li>${u}</li>`).join('');
  });
</script>
</body>
</html>
