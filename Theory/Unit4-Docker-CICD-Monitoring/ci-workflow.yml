name: Unit 4 Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Theory/Unit4-Docker-CICD-Monitoring
        run: npm install

      - name: Run automated API tests
        working-directory: Theory/Unit4-Docker-CICD-Monitoring
        run: npm test

      - name: Build Docker container image
        working-directory: Theory/Unit4-Docker-CICD-Monitoring
        run: docker build -t unit4-backend:ci .
