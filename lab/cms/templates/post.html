<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p><strong>By {{ post.author }}</strong></p>
    <p><em>{{ post.createdAt }}</em></p>
    <hr>
    <h3>Full Post Content:</h3>
    <p>{{ post.content }}</p>
    <hr>
    <br>
    <a href="/posts/{{ post._id }}/edit">Edit Post</a>
    &nbsp;&nbsp;
    <form action="/posts/{{ post._id }}/delete" method="POST" style="display:inline;">
        <button type="submit" onclick="return confirm('Delete this post?')">Delete Post</button>
    </form>
    <br><br>
    <a href="/posts">Back to All Posts</a>
</body>
</html>
