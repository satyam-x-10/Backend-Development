<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
</head>
<body>
    <h1>{{ post.title }}</h1>
    <p><strong>By {{ post.author }}</strong></p>
    <p><em>{{ post.createdAt }}</em></p>
    <hr>
    <h3>Full Post Content:</h3>
    <p>{{ post.content }}</p>
    <hr>
    <br>
    <a href="/posts">Back to All Posts</a>
</body>
</html>
